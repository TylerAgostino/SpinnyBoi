kind: pipeline
name: default
type: docker

steps:
  - name: test
    image: python:3.12-slim
    commands:
      # WheelSpinner GIF tests drive headless Firefox via selenium; mirror the
      # runtime Dockerfile's browser provisioning so CI can actually run them.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl firefox-esr
      - curl -sSL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz | tar xz -C /usr/local/bin
      - pip install --quiet -r requirements-dev.txt
      - python -m pytest -q
  - name: lint
    image: python:3.12-slim
    commands:
      - pip install --quiet -r requirements-dev.txt
      - python -m pyflakes modules tests
  - name: build
    depends_on:
      - test
      - lint
    image: plugins/docker
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      registry: registry.hub.docker.com
      repo: registry.hub.docker.com/tyleragostino/spinnyboi
      tags: latest
      cache_from: "registry.hub.docker.com/tyleragostino/spinnyboi:latest"
    when:
      event:
        - push
      branch:
        - main
      changeset:
        includes: [ "**/**.py", "**/**.txt", "**/Dockerfile" ]
  - name: deploy
    depends_on:
      - build
    image: plugins/webhook
    settings:
      urls: http://192.168.1.125:9996/api/stacks/webhooks/81cacdd6-d5ef-45cd-9983-cd3ff1f1058b
    when:
      event:
        - push
      branch:
        - main
      changeset:
        includes: [ "**/**.py", "**/**.txt", "**/docker_compose.yaml", "**/Dockerfile"  ]

trigger:
  event:
    - push
    - pull_request
  ref:
    - refs/heads/**
    - refs/pull/*/merge
    - refs/pull/*/head
