version: '3.9'
services:
  spinnyboi:
    image: tyleragostino/spinnyboi:latest
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GSHEET_ID=${GSHEET_ID}
      - DATABASE_URL=sqlite:///data/spinny.db
      - IRACING_EMAIL=${IRACING_EMAIL}
      - IRACING_PASSWORD=${IRACING_PASSWORD}
      - IRACING_CLIENT_ID=${IRACING_CLIENT_ID}
      - IRACING_CLIENT_SECRET=${IRACING_CLIENT_SECRET}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_CREDENTIALS_FILE=${GOOGLE_CREDENTIALS_FILE}
      - REGISTRATION_SHEET_ID=${REGISTRATION_SHEET_ID}
      - ATTENDANCE_SHEET_ID=${ATTENDANCE_SHEET_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LEAGUE_SEASON=${LEAGUE_SEASON}
      - LEAGUE_STAFF_ROLE_ID=${LEAGUE_STAFF_ROLE_ID}
      - LEAGUE_DRIVER_ROLE_ID=${LEAGUE_DRIVER_ROLE_ID}
      - LEAGUE_REGISTRATION_SHEET=${LEAGUE_REGISTRATION_SHEET}
      - LEAGUE_POINTS_SHEET=${LEAGUE_POINTS_SHEET}
      - LEAGUE_POINTS_ID_COLUMN=${LEAGUE_POINTS_ID_COLUMN}
      - IRACING_LEAGUE_ID=${IRACING_LEAGUE_ID}
      - SRH_SERIES_ID=${SRH_SERIES_ID}
      - SRH_AM_SERIES_ID=${SRH_AM_SERIES_ID}
      - SRH_SEASON_ID=${SRH_SEASON_ID}
      - LEAGUE_DEBUG_GUILD_IDS=${LEAGUE_DEBUG_GUILD_IDS}
      - LEAGUE_AUTO_DELETE_CHANNEL_ID=${LEAGUE_AUTO_DELETE_CHANNEL_ID}
      - LEAGUE_VECTOR_CHANNEL_ID=${LEAGUE_VECTOR_CHANNEL_ID}
      - LEAGUE_VECTOR_EMBEDDING_PROVIDER=${LEAGUE_VECTOR_EMBEDDING_PROVIDER}
      - LEAGUE_VECTOR_EMBEDDING_MODEL=${LEAGUE_VECTOR_EMBEDDING_MODEL}
      - LEAGUE_VECTOR_EMBEDDING_BASE_URL=${LEAGUE_VECTOR_EMBEDDING_BASE_URL}
      - LEAGUE_VECTOR_TOP_K=${LEAGUE_VECTOR_TOP_K}
      - LEAGUE_VECTOR_RELEVANCE_THRESHOLD=${LEAGUE_VECTOR_RELEVANCE_THRESHOLD}
      - LEAGUE_VECTOR_MAX_CHUNK_CHARS=${LEAGUE_VECTOR_MAX_CHUNK_CHARS}
      - LEAGUE_VECTOR_HISTORY_SINCE=${LEAGUE_VECTOR_HISTORY_SINCE}
      - LEAGUE_VECTOR_HISTORY_SINCE_BY_CHANNEL=${LEAGUE_VECTOR_HISTORY_SINCE_BY_CHANNEL}
      # (LEAGUE_VECTOR_HISTORY_SINCE_<channel_id> suffixed keys work when the
      #  container receives them directly, e.g. via env_file or docker run)
      - WEB_LOOKUP_ENABLED=${WEB_LOOKUP_ENABLED}
      - WEB_LOOKUP_TIMEOUT_SECONDS=${WEB_LOOKUP_TIMEOUT_SECONDS}
      - WEB_LOOKUP_MIN_INTERVAL_SECONDS=${WEB_LOOKUP_MIN_INTERVAL_SECONDS}
      - WEB_LOOKUP_MAX_RESULTS=${WEB_LOOKUP_MAX_RESULTS}
      - WEB_LOOKUP_MAX_SNIPPET_CHARS=${WEB_LOOKUP_MAX_SNIPPET_CHARS}
      - WEB_LOOKUP_MAX_QUERY_CHARS=${WEB_LOOKUP_MAX_QUERY_CHARS}
      - SIMRACERHUB_ENABLED=${SIMRACERHUB_ENABLED}
      - SIMRACERHUB_SEASON_ID=${SIMRACERHUB_SEASON_ID}
      - SIMRACERHUB_SERIES_ID=${SIMRACERHUB_SERIES_ID}
      - SIMRACERHUB_TIMEOUT_SECONDS=${SIMRACERHUB_TIMEOUT_SECONDS}
      - SIMRACERHUB_MIN_INTERVAL_SECONDS=${SIMRACERHUB_MIN_INTERVAL_SECONDS}
      - SIMRACERHUB_MAX_ROWS=${SIMRACERHUB_MAX_ROWS}
      - AUDITOR_WEBHOOK_URL=${AUDITOR_WEBHOOK_URL}
    volumes:
      - spinny_db:/app/data
      - /mnt/user/apollo-share/Fonts:/usr/share/fonts/
    dns:
      - 1.1.1.1

volumes:
  spinny_db:
